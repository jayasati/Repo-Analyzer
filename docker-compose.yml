# DB password: POSTGRES_PASSWORD is set only on the *first* start (empty postgres_data volume).
# If you change DB_PASSWORD in .env later, Postgres still uses the old password → auth errors.
# Fix: docker compose down -v  (wipes DB) then docker compose up --build -d
# Ensure project .env DB_PASSWORD matches DATABASE_URL / compose substitution.

services:

  postgres:
    image: postgres:16-alpine
    container_name: repo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-JAY123456}
      POSTGRES_DB:       ${DB_NAME:-repo_analyzer}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-repo_analyzer}"]
      interval: 5s
      timeout:  3s
      retries:  10

  redis:
    image: redis:7-alpine
    container_name: repo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  10

  api:
    build:
      context:    .
      dockerfile: Dockerfile
      target:     production
    container_name: repo-api
    restart: unless-stopped
    command: node dist/main
    env_file: .env
    environment:
      NODE_ENV:   production
      RUN_QUEUE_PROCESSOR: "false"
      DB_HOST:    postgres
      DB_PORT:    "5432"
      DB_USER:    ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-JAY123456}
      DB_NAME:    ${DB_NAME:-repo_analyzer}
      # Overrides .env localhost URL — inside Docker the DB host must be the service name
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-JAY123456}@postgres:5432/${DB_NAME:-repo_analyzer}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context:    .
      dockerfile: Dockerfile
      target:     production
    container_name: repo-worker
    restart: unless-stopped
    command: node dist/worker/worker.js
    env_file: .env
    environment:
      NODE_ENV:   production
      RUN_QUEUE_PROCESSOR: "true"
      DB_HOST:    postgres
      DB_PORT:    "5432"
      DB_USER:    ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-JAY123456}
      DB_NAME:    ${DB_NAME:-repo_analyzer}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-JAY123456}@postgres:5432/${DB_NAME:-repo_analyzer}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: